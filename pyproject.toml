[project]
name = "askledger"
version = "0.1.0rc1"
description = "Answer questions about a small business's sales and expenses with SQL that runs in a locked, read-only SQLite sandbox, measured by execution accuracy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shreyas" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
askledger = "askledger.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S311: the random module only seeds synthetic data and test faults, never secrets.
ignore = ["E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S608"]
# Templates fill SQL with values read from the database that match SAFE_VALUE, and with
# fixed words and computed dates. tests/test_templates.py checks every value.
"src/askledger/templates.py" = ["S608"]
"scripts/*" = ["S608"]
